<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 5 javaScript02</title>
</head>
<body>
    <script>
        let cadena = prompt("Introduce una cadena");
        let cadena2 = prompt("Introduce otra cadena")
        let letra = prompt("Introduce una letra");
        let cont1 = 0;
        let cont2 = 0;        
        function cadenascomp(cadena, cadenax, letra) {
            for (let letr of cadena) {
                if (letra.includes(letr)) {
                    cont1++;
                }
            }
            for (let letr of cadenax) {
                if (letra.includes(letr)) {
                    cont2++;
                }
            }
            if (cont1 > cont2){
                return cadena;
            }else{
                return cadenax;
            }
        }

        console.log("La cadena que más contiene la letra ", letra, " es: ", cadenascomp(cadena, cadena2, letra));
    </script>
    
</body>
</html>
