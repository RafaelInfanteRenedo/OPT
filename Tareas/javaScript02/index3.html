<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 3 javaScript02</title>
</head>
<body>
    <script>
        let cadena = prompt("Introduce una cadena o frase");
        function primeraLetraNoEspacio(cadena) {
            for (let letra of cadena) {
                if (letra !== " ") {
                    return letra;
                }
            }

            return "";
        }

        console.log(primeraLetraNoEspacio(cadena));
    </script>
    
</body>
</html>
