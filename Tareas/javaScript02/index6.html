<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 6 javaScript02</title>
</head>
<body>
    <script>
        let cadena = prompt("Introduce una cadena");
        let cadena2 = prompt("Introduce otra cadena")
        function buscarCadena(cadena1, cadena2) {
            return cadena1.toLowerCase().indexOf(cadena2.toLowerCase());
        }
        console.log("La posicion en la que senmcuentra la cadena 1 en la cadena 2 es: ", buscarCadena(cadena, cadena2));
    </script>
    
</body>
