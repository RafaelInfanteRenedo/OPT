<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 7 javaScript02</title>
</head>
<body>
    <script>
        let nombre = "Rafael";

        function letraAleatoria(nombre) {
            let posicion = Math.floor(Math.random() * nombre.length);
    
            console.log("La letra aleatoria es: " + nombre[posicion]);
            console.log("Su posición es: " + posicion);
        }

        letraAleatoria(nombre);
    </script>
    
</body>
