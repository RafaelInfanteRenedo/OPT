<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej 7 javaScript02</title>
</head>
<body>
    <script>
        let fecha = prompt("Introduce una fecha en formato dd/mm/aaaa:");

        let partes = fecha.split("/");

        if (partes.length !== 3) {
            console.log("Formato no válido");
        } else {
            let dia = partes[0];
            let mes = partes[1];
            let año = partes[2];

            if (dia < 1 || dia > 31 || mes < 1 || mes > 12 || año.length !== 4) {
                console.log("Formato no válido");
            } else {
                let meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

                console.log(año + "-" + mes + "-" + dia);
                console.log(dia + " de " + meses[mes - 1] + " de " + año);
            }
        }
    </script>
    
</body>
</html>
