<body>
    <script>
        let fecha = new Date();
        let mes = fecha.toDateString();
        let fechita = mes.split(" ");
        console.log("Hoy es ", fechita[0], fechita[2], " de ", fechita[1], " de ", fechita[3]);
    </script>
    
</body>
